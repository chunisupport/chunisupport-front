name: Apply record filter documentation fix

on:
  push:
    branches:
      - docs/update-record-filter-documentation

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: docs/update-record-filter-documentation
      - name: Update documentation
        shell: python
        run: |
          from pathlib import Path

          path = Path('docs/record-filter-and-columns.md')
          text = path.read_text()

          replacements = [
              (
                  '  "difficulties": ["MASTER", "ULTIMA"],\n  "genres": [],',
                  '  "difficulties": ["MASTER", "ULTIMA"],\n  "opTargetOnly": false,\n  "opTargetType": "current",\n  "favoriteSongsOnly": false,\n  "excludeLockedSongs": false,\n  "genres": [],',
              ),
              (
                  '  "hard_lamp": ["CATASTROPHY", "ABSOLUTE", "BRAVE", "HARD", "CLEAR", "FAILED", null],\n  "excludeNoPlay": false\n}',
                  '  "hard_lamp": ["CATASTROPHY", "ABSOLUTE", "BRAVE", "HARD", "CLEAR", "FAILED", null],\n  "excludeNoPlay": false,\n  "updatedAt": {\n    "min": "",\n    "max": ""\n  }\n}',
              ),
              (
                  '| `difficulties` | `string[]` | はい | 対象難易度の配列です。難易度値は `BASIC`, `ADVANCED`, `EXPERT`, `MASTER`, `ULTIMA` のように大文字で扱います。空配列にすると全件不一致になります。 |\n| `genres` |',
                  '| `difficulties` | `string[]` | はい | 対象難易度の配列です。難易度値は `BASIC`, `ADVANCED`, `EXPERT`, `MASTER`, `ULTIMA` のように大文字で扱います。空配列にすると全件不一致になります。 |\n| `opTargetOnly` | `boolean` | はい | `true` の場合、OVER POWER対象譜面だけを表示します。 |\n| `opTargetType` | `"current"` \\| `"theoretical"` | はい | `current` は現在の集計対象、`theoretical` は楽曲ごとの理論値対象難易度で判定します。 |\n| `favoriteSongsOnly` | `boolean` | はい | `true` の場合、お気に入り登録済みの楽曲だけを表示します。 |\n| `excludeLockedSongs` | `boolean` | はい | `true` の場合、未解禁設定に登録された楽曲とULTIMA譜面を除外します。 |\n| `genres` |',
              ),
              (
                  '| `excludeNoPlay` | `boolean` | はい | `true` の場合、未プレイ譜面を除外します。 |\n\n### 通常レコードの判定ルール',
                  '| `excludeNoPlay` | `boolean` | はい | `true` の場合、未プレイ譜面を除外します。 |\n| `updatedAt` | `{ min: string, max: string }` | はい | 最終更新日の範囲です。空文字列は該当する範囲端を指定しないことを表します。 |\n\n### 通常レコードの判定ルール',
              ),
              (
                  '1. `excludeNoPlay` が `true` のとき、未プレイではないこと。\n2. `title` が空でないとき、曲名、アーティスト名、読みのいずれかに一致すること。\n3. `difficulty` が `difficulties` に含まれること。\n4. `genres` が空でないとき、レコードのジャンルが `genres` に含まれること。\n5. `versions` が空でないとき、レコードのバージョンが `versions` に含まれること。\n6. 譜面定数が `const.min` 以上かつ `const.max` 以下であること。\n7. スコアが `score.min` 以上かつ `score.max` 以下であること。\n8. `justiceCount.min` または `justiceCount.max` が `null` でないとき、コンボランプが `ALL JUSTICE` で、`justice_count` が `null` ではなく、指定範囲内であること。\n9. `overPower.min` または `overPower.max` が `null` でないとき、プレイ済み譜面で、`overpower` が指定範囲内であること。\n10. AJC 判定後のコンボランプが `combo_lamp` に含まれること。JUSTICE 数フィルターの有効・無効にかかわらず判定します。\n11. FULL CHAIN ランプが `chain_lamp` に含まれること。\n12. クリアランプが `hard_lamp` に含まれること。',
                  '1. `excludeNoPlay` が `true` のとき、未プレイではないこと。\n2. `title` が空でないとき、曲名、アーティスト名、読みのいずれかに一致すること。\n3. `difficulty` が `difficulties` に含まれること。\n4. `opTargetOnly` が `true` のとき、`opTargetType` に応じたOVER POWER対象譜面であること。\n5. `favoriteSongsOnly` が `true` のとき、お気に入り登録済みの楽曲であること。\n6. `excludeLockedSongs` が `true` のとき、未解禁設定の通常楽曲ではなく、ULTIMAの場合は未解禁設定のULTIMA譜面でもないこと。\n7. `genres` が空でないとき、レコードのジャンルが `genres` に含まれること。\n8. `versions` が空でないとき、レコードのバージョンが `versions` に含まれること。\n9. 譜面定数が `const.min` 以上かつ `const.max` 以下であること。\n10. スコアが `score.min` 以上かつ `score.max` 以下であること。\n11. `justiceCount.min` または `justiceCount.max` が `null` でないとき、コンボランプが `ALL JUSTICE` で、`justice_count` が `null` ではなく、指定範囲内であること。\n12. `overPower.min` または `overPower.max` が `null` でないとき、プレイ済み譜面で、`overpower` が指定範囲内であること。\n13. AJC 判定後のコンボランプが `combo_lamp` に含まれること。JUSTICE 数フィルターの有効・無効にかかわらず判定します。\n14. FULL CHAIN ランプが `chain_lamp` に含まれること。\n15. クリアランプが `hard_lamp` に含まれること。\n16. `updatedAt` で指定した最終更新日の範囲内であること。',
              ),
              (
                  '- `difficulties`: `["MASTER", "ULTIMA"]`\n- `genres`:',
                  '- `difficulties`: `["MASTER", "ULTIMA"]`\n- `opTargetOnly`: `false`\n- `opTargetType`: `"current"`\n- `favoriteSongsOnly`: `false`\n- `excludeLockedSongs`: `false`\n- `genres`:',
              ),
              (
                  '- `excludeNoPlay`: `false`\n\n## WORLD\'S END FilterState',
                  '- `excludeNoPlay`: `false`\n- `updatedAt.min`: `""`\n- `updatedAt.max`: `""`\n\n## WORLD\'S END FilterState',
              ),
              (
                  '    "opTargetType": "theoretical",\n    "genres": [],',
                  '    "opTargetType": "theoretical",\n    "favoriteSongsOnly": false,\n    "excludeLockedSongs": true,\n    "genres": [],',
              ),
              (
                  '    "hard_lamp": ["CATASTROPHY", "ABSOLUTE", "BRAVE", "HARD"],\n    "excludeNoPlay": true\n  }',
                  '    "hard_lamp": ["CATASTROPHY", "ABSOLUTE", "BRAVE", "HARD"],\n    "excludeNoPlay": true,\n    "updatedAt": {\n      "min": "",\n      "max": ""\n    }\n  }',
              ),
              (
                  '  "schema_version": 7,',
                  '  "schema_version": 8,',
              ),
              (
                  '現行値は通常レコードが `7`、WORLD\'S END が `4`',
                  '現行値は通常レコードが `8`、WORLD\'S END が `4`',
              ),
              (
                  '      "schema_version": 6,',
                  '      "schema_version": 8,',
              ),
              (
                  '- 通常レコードは現行の `schema_version: 7` に加え、互換対象の `3`, `4`, `5`, `6` を有効として扱います。',
                  '- 通常レコードは現行の `schema_version: 8` に加え、互換対象の `3`, `4`, `5`, `6`, `7` を有効として扱います。',
              ),
          ]

          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'expected exactly one match, got {count}: {old[:80]!r}')
              text = text.replace(old, new, 1)

          path.write_text(text)
      - name: Commit changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-record-filter-doc-fix-temp.yml
          git add docs/record-filter-and-columns.md
          git commit -m "docs: update record filter documentation"
          git push
