name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: ".node-version"
          cache: "pnpm"

      - name: Copy .env.example to .env
        run: cp .env.example .env

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check third-party licenses
        run: pnpm run licenses:check

      - name: Verify license check leaves stale notices untouched
        run: |
          notice=THIRD-PARTY-NOTICES.txt
          backup=$(mktemp)
          cp -p "$notice" "$backup"
          trap 'mv "$backup" "$notice"' EXIT
          printf '\nCI stale-notice fixture\n' >> "$notice"
          checksums=$(sha256sum "$notice" "public/$notice")
          if output=$(pnpm run licenses:check 2>&1); then
            echo "License check accepted a stale notice"
            exit 1
          fi
          printf '%s\n' "$output" | grep -F 'License notice files are not up to date:'
          test "$checksums" = "$(sha256sum "$notice" "public/$notice")"

      - name: Check
        run: pnpm run check:ci

      - name: Typecheck
        run: pnpm run typecheck

      - name: Unit test
        run: pnpm run test:unit

      - name: Build
        run: pnpm run build
