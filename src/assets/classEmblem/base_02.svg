<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 94 46" width="94" height="46" role="img" aria-label="エンブレム台座 II">
  <defs>
    <linearGradient id="b02-gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff6c8"/>
      <stop offset="0.5" stop-color="#ffd24e"/>
      <stop offset="1" stop-color="#e0a030"/>
    </linearGradient>
    <linearGradient id="b02-bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fffbe0"/>
      <stop offset="1" stop-color="#f5c040"/>
    </linearGradient>
    <!-- 細かい斜線の地模様 -->
    <pattern id="b02-texture" width="1.6" height="1.6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="0.8" height="1.6" fill="#ffffff" opacity="0.07"/>
    </pattern>
    <clipPath id="b02-panel">
      <rect x="3.9" y="12.6" width="86.2" height="20.2"/>
    </clipPath>
    <linearGradient id="b02-gem" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#26c8a0"/>
      <stop offset="0.5" stop-color="#1aae8a"/>
      <stop offset="0.5" stop-color="#0e9a76"/>
      <stop offset="1" stop-color="#08805f"/>
    </linearGradient>
    <g id="b02-deco" fill="none" stroke-linejoin="miter" clip-path="url(#b02-panel)">
      <path d="M17.4 12.6 L8 22.7 L17.4 32.8 M20.8 12.6 L11.4 22.7 L20.8 32.8" stroke="#3a1e06" stroke-width="2.4"/>
      <path d="M17.4 12.6 L8 22.7 L17.4 32.8 M20.8 12.6 L11.4 22.7 L20.8 32.8" stroke="url(#b02-gold)" stroke-width="1.2"/>
    </g>
  </defs>
  <!-- 外枠（銀の縁と影） -->
  <rect x="0.6" y="9.2" width="92.8" height="27.8" fill="#d2d2d2" stroke="#000000" stroke-opacity="0.35" stroke-width="0.6"/>
  <!-- 金の額縁 -->
  <rect x="2" y="10.7" width="90" height="24.6" fill="url(#b02-gold)" stroke="#5a3208" stroke-width="0.5"/>
  <!-- 宝石面 -->
  <rect x="3.9" y="12.6" width="86.2" height="20.2" fill="url(#b02-gem)"/>
  <rect x="3.9" y="12.6" width="86.2" height="20.2" fill="url(#b02-texture)"/>
  <use href="#b02-deco"/>
  <use href="#b02-deco" transform="translate(94 0) scale(-1 1)"/>
  <rect x="3.9" y="12.6" width="86.2" height="20.2" fill="none" stroke="#3a1e06" stroke-width="0.7"/>
</svg>
