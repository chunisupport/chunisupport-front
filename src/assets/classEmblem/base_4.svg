<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 94 46" width="94" height="46" role="img" aria-label="エンブレム台座 IV">
  <defs>
    <linearGradient id="b04-gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff6c8"/>
      <stop offset="0.5" stop-color="#ffd24e"/>
      <stop offset="1" stop-color="#e0a030"/>
    </linearGradient>
    <linearGradient id="b04-bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fffbe0"/>
      <stop offset="1" stop-color="#f5c040"/>
    </linearGradient>
    <!-- 細かい斜線の地模様 -->
    <pattern id="b04-texture" width="1.6" height="1.6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="0.8" height="1.6" fill="#ffffff" opacity="0.07"/>
    </pattern>
    <clipPath id="b04-panel">
      <rect x="3.9" y="12.6" width="86.2" height="20.2"/>
    </clipPath>
    <linearGradient id="b04-gem" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff5a44"/>
      <stop offset="0.5" stop-color="#f02a1c"/>
      <stop offset="0.5" stop-color="#dc1e0e"/>
      <stop offset="1" stop-color="#b01008"/>
    </linearGradient>
    <g id="b04-deco">
      <rect x="6" y="12.6" width="8.8" height="20.2" fill="#5a0a0a"/>
      <rect x="6" y="12.6" width="2.3" height="20.2" fill="url(#b04-bar)" stroke="#3a1e06" stroke-width="0.4"/>
      <rect x="12.5" y="12.6" width="2.3" height="20.2" fill="url(#b04-bar)" stroke="#3a1e06" stroke-width="0.4"/>
      <rect x="9.4" y="21.70" width="2" height="2" fill="#fff4c0" stroke="#5a3208" stroke-width="0.3"/>
    </g>
  </defs>
  <!-- 外枠（銀の縁と影） -->
  <rect x="0.6" y="9.2" width="92.8" height="27.8" fill="#d2d2d2" stroke="#000000" stroke-opacity="0.35" stroke-width="0.6"/>
  <!-- 金の額縁 -->
  <rect x="2" y="10.7" width="90" height="24.6" fill="url(#b04-gold)" stroke="#5a3208" stroke-width="0.5"/>
  <!-- 宝石面 -->
  <rect x="3.9" y="12.6" width="86.2" height="20.2" fill="url(#b04-gem)"/>
  <rect x="3.9" y="12.6" width="86.2" height="20.2" fill="url(#b04-texture)"/>
  <g clip-path="url(#b04-panel)" fill="#ffffff">
    <polygon points="12,12.6 25,12.6 45,32.8 32,32.8" opacity="0.18"/>
    <polygon points="82,12.6 69,12.6 49,32.8 62,32.8" opacity="0.1"/>
  </g>
  <use href="#b04-deco"/>
  <use href="#b04-deco" transform="translate(94 0) scale(-1 1)"/>
  <rect x="3.9" y="12.6" width="86.2" height="20.2" fill="none" stroke="#3a1e06" stroke-width="0.7"/>
</svg>
