<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 94 46" width="94" height="46" role="img" aria-label="エンブレム台座 ∞">
  <defs>
    <linearGradient id="b06-gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff6c8"/>
      <stop offset="0.5" stop-color="#ffd24e"/>
      <stop offset="1" stop-color="#e0a030"/>
    </linearGradient>
    <linearGradient id="b06-bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fffbe0"/>
      <stop offset="1" stop-color="#f5c040"/>
    </linearGradient>
    <!-- 細かい斜線の地模様 -->
    <pattern id="b06-texture" width="1.6" height="1.6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="0.8" height="1.6" fill="#ffffff" opacity="0.07"/>
    </pattern>
    <clipPath id="b06-panel">
      <rect x="3.9" y="12.6" width="86.2" height="20.2"/>
    </clipPath>
    <linearGradient id="b06-gem" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7cc8ff"/>
      <stop offset="0.2" stop-color="#e6f5ff"/>
      <stop offset="0.45" stop-color="#ffaee8"/>
      <stop offset="0.62" stop-color="#e59cff"/>
      <stop offset="0.85" stop-color="#ffec8a"/>
      <stop offset="1" stop-color="#ffd23a"/>
    </linearGradient>
    <g id="b06-deco">
      <rect x="6" y="12.6" width="8.8" height="20.2" fill="#2a0f40"/>
      <rect x="6" y="12.6" width="2.3" height="20.2" fill="url(#b06-bar)" stroke="#3a1e06" stroke-width="0.4"/>
      <rect x="12.5" y="12.6" width="2.3" height="20.2" fill="url(#b06-bar)" stroke="#3a1e06" stroke-width="0.4"/>
      <rect x="9.4" y="14.60" width="2" height="2" fill="#fff4c0" stroke="#5a3208" stroke-width="0.3"/><rect x="9.4" y="21.70" width="2" height="2" fill="#fff4c0" stroke="#5a3208" stroke-width="0.3"/><rect x="9.4" y="29.30" width="2" height="2" fill="#fff4c0" stroke="#5a3208" stroke-width="0.3"/>
    </g>
  </defs>
  <!-- 外枠（銀の縁と影） -->
  <rect x="0.6" y="9.2" width="92.8" height="27.8" fill="#d2d2d2" stroke="#000000" stroke-opacity="0.35" stroke-width="0.6"/>
  <!-- 金の額縁 -->
  <rect x="2" y="10.7" width="90" height="24.6" fill="url(#b06-gold)" stroke="#5a3208" stroke-width="0.5"/>
  <!-- 宝石面 -->
  <rect x="3.9" y="12.6" width="86.2" height="20.2" fill="url(#b06-gem)"/>
  <rect x="3.9" y="12.6" width="86.2" height="20.2" fill="url(#b06-texture)"/>
  <rect x="3.9" y="12.6" width="86.2" height="10.1" fill="#ffffff" opacity="0.35"/>
  <rect x="3.9" y="22.7" width="86.2" height="10.1" fill="#6a7cff" opacity="0.14"/>
  <g clip-path="url(#b06-panel)" fill="#ffffff">
    <polygon points="12,12.6 25,12.6 45,32.8 32,32.8" opacity="0.45"/>
    <polygon points="82,12.6 69,12.6 49,32.8 62,32.8" opacity="0.35"/>
  </g>
  <use href="#b06-deco"/>
  <use href="#b06-deco" transform="translate(94 0) scale(-1 1)"/>
  <rect x="3.9" y="12.6" width="86.2" height="20.2" fill="none" stroke="#3a1e06" stroke-width="0.7"/>
</svg>
