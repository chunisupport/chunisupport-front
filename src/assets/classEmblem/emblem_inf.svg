<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 94 46" width="94" height="46" role="img" aria-label="クラスエンブレム ∞">
  <defs>
    <linearGradient id="m06-gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fffbe0"/>
      <stop offset="0.5" stop-color="#ffe066"/>
      <stop offset="0.5" stop-color="#f8bb2e"/>
      <stop offset="1" stop-color="#dd9a24"/>
    </linearGradient>
    <linearGradient id="m06-cream" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fffdf0"/>
      <stop offset="0.5" stop-color="#fbeec2"/>
      <stop offset="1" stop-color="#dcc285"/>
    </linearGradient>
    <!-- 背面の飾り用: 下ほど暗くなる金 -->
    <linearGradient id="m06-deepGold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fffbd0"/>
      <stop offset="0.45" stop-color="#ffd24e"/>
      <stop offset="0.72" stop-color="#a86a14"/>
      <stop offset="1" stop-color="#2a1406"/>
    </linearGradient>
    <linearGradient id="m06-wingGold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fffbe0"/>
      <stop offset="0.35" stop-color="#ffe066"/>
      <stop offset="0.7" stop-color="#f8bb2e"/>
      <stop offset="1" stop-color="#dd9a24"/>
    </linearGradient>
    <linearGradient id="m06-goldDiag" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fffbe6"/>
      <stop offset="0.45" stop-color="#ffdc55"/>
      <stop offset="1" stop-color="#e8a42a"/>
    </linearGradient>
    <linearGradient id="m06-silverLight" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#d9dee8"/>
    </linearGradient>
    <linearGradient id="m06-silverDark" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a9b1c2"/>
      <stop offset="1" stop-color="#6f7890"/>
    </linearGradient>
    <linearGradient id="m06-iridescent" x1="0.15" y1="0.1" x2="0.85" y2="0.95">
      <stop offset="0" stop-color="#bff3e4"/>
      <stop offset="0.3" stop-color="#fdf7d6"/>
      <stop offset="0.6" stop-color="#fbd2e3"/>
      <stop offset="1" stop-color="#cfe0ff"/>
    </linearGradient>
    <radialGradient id="m06-shine" cx="0.35" cy="0.3" r="0.7">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.85"/>
      <stop offset="0.6" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <g id="m06-silverSpike">
      <polygon points="41.05,12.7 47,2.4 47,13.7" fill="url(#m06-silverLight)"/>
      <polygon points="47,2.4 52.95,12.7 47,13.7" fill="url(#m06-silverDark)"/>
      <polygon points="41.05,12.7 47,2.4 52.95,12.7" fill="none" stroke="#3f4558" stroke-width="0.7" stroke-linejoin="round"/>
    </g>
    <g id="m06-goldSpike">
      <polygon points="40.53,11.8 47,0.6 47,12.8" fill="#fffbd0"/>
      <polygon points="47,0.6 53.47,11.8 47,12.8" fill="#f0b030"/>
      <polygon points="40.53,11.8 47,0.6 53.47,11.8" fill="none" stroke="#5a3208" stroke-width="0.7" stroke-linejoin="round"/>
    </g>
    <!-- ∞の金: 左下が淡く、右上ほど濃いオレンジ -->
    <linearGradient id="m06-infinityGold" gradientUnits="userSpaceOnUse" x1="-9" y1="9" x2="9" y2="-9">
      <stop offset="0" stop-color="#fffbd6"/>
      <stop offset="0.5" stop-color="#ffe066"/>
      <stop offset="1" stop-color="#f5a623"/>
    </linearGradient>
    <g id="m06-wing" fill="url(#m06-wingGold)" stroke="#5a3208" stroke-width="0.7" stroke-linejoin="miter"><path d="M41 21.7 L22.8 25.3 L26.4 31 L41 26 Z"/><path d="M41 17.4 L19.8 19.6 L21.6 25.3 L41 21.7 Z"/><path d="M41 13.2 L17.6 14 L18.8 19.6 L41 17.4 Z"/></g>
  </defs>
  <use href="#m06-wing"/>
  <use href="#m06-wing" transform="translate(94 0) scale(-1 1)"/>
  <use href="#m06-goldSpike"/>
  <use href="#m06-goldSpike" transform="rotate(60 47 23)"/>
  <use href="#m06-goldSpike" transform="rotate(120 47 23)"/>
  <use href="#m06-goldSpike" transform="rotate(180 47 23)"/>
  <use href="#m06-goldSpike" transform="rotate(240 47 23)"/>
  <use href="#m06-goldSpike" transform="rotate(300 47 23)"/>
  <use href="#m06-silverSpike" transform="rotate(30 47 23)"/>
  <use href="#m06-silverSpike" transform="rotate(90 47 23)"/>
  <use href="#m06-silverSpike" transform="rotate(150 47 23)"/>
  <use href="#m06-silverSpike" transform="rotate(210 47 23)"/>
  <use href="#m06-silverSpike" transform="rotate(270 47 23)"/>
  <use href="#m06-silverSpike" transform="rotate(330 47 23)"/>
  <circle cx="47" cy="23" r="14.2" fill="url(#m06-goldDiag)" stroke="#4a2a10" stroke-width="0.7"/>
  <circle cx="47" cy="23" r="11.2" fill="url(#m06-iridescent)"/>
  <circle cx="47" cy="23" r="11.2" fill="url(#m06-shine)"/>
  <circle cx="47" cy="23" r="11.2" fill="none" stroke="#4a2a10" stroke-width="0.6"/>
  <g transform="translate(47 22.8)" fill="none" stroke-linejoin="miter">
    <path d="M0 0 L-6.49 -5.12 L-10.79 0 L-6.49 5.12 Z M0 0 L6.49 -5.12 L10.79 0 L6.49 5.12 Z" stroke="#4a2a10" stroke-width="4.4"/>
    <path d="M0 0 L-6.49 -5.12 L-10.79 0 L-6.49 5.12 Z M0 0 L6.49 -5.12 L10.79 0 L6.49 5.12 Z" stroke="url(#m06-infinityGold)" stroke-width="3.4"/>
    <path d="M-2.6 2.05 L2.6 -2.05" stroke="#4a2a10" stroke-width="4.4"/>
    <path d="M-3.89 3.07 L3.89 -3.07" stroke="url(#m06-infinityGold)" stroke-width="3.4"/>
  </g>
</svg>
